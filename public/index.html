<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Chat Application</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.1/css/all.min.css"
    integrity="sha256-mmgLkCYLUQbXn0B1SRqzHar6dCnv9oZFPEC1g1cwlkk="
    crossorigin="anonymous"
  />
</head>
<body class="bg-light">

  <div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-lg p-4 w-100" style="max-width: 500px;">
      <div class="card-header bg-primary text-white text-center rounded">
        <h2><i class="fas fa-smile me-2"></i>Chat App</h2>
      </div>
      <div class="card-body">
        <form action="chat.html">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              name="username"
              id="username"
              class="form-control rounded-pill shadow-sm"
              placeholder="Enter username..."
              required
            />
          </div>
          <div class="mb-3">
            <label for="room" class="form-label">Room</label>
            <select
              name="room"
              id="room"
              class="form-select rounded-pill shadow-sm"
              required
            >
              <option value="Cinema">Cinema</option>
              <option value="Comedy">Comedy</option>
              <option value="Love">Love</option>
              <option value="Dialogues">Dialogues</option>
              <option value="Poems">Poems</option>
              <option value="Songs">Songs</option>
              <option value="Quotes">Quotes</option>
              <option value="Jokes">Jokes</option>
              <option value="Stories">Stories</option>
              <option value="News">News</option>
              <option value="Sports">Sports</option>
              <option value="Politics">Politics</option>
              <option value="Technology">Technology</option>
            </select>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary rounded-pill shadow-sm">
              Join Chat
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle (optional for dropdowns, modals, etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
